name: Deploy landing page

# ONE-TIME SETUP (required before the first successful run):
#   GitHub repo -> Settings -> Pages -> Build and deployment -> Source:
#   "GitHub Actions".
#
# An earlier revision tried `enablement: true` on actions/configure-pages to do
# this automatically. It fails with a 403 on this repo -- the workflow's
# GITHUB_TOKEN cannot turn Pages on for a repository that has never had it
# enabled. Flipping the source in Settings once is the fix; nothing here needs
# to change afterwards.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  # Lets you redeploy from the Actions tab without touching the site -- use
  # this to re-run after enabling Pages in Settings.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; don't cancel a run that is mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
